# math-admin at https://numi.asia/admin/ — files deployed by deploy/deploy.sh to
# /apps/www/numi/admin, next to the landing page in /apps/www/numi/html.
#
# Paste into BOTH the HTTP (80) and the HTTPS (443) `server` blocks of
# /etc/nginx/sites-available/numi.asia on the EC2 host, above `location /`, then:
#   sudo nginx -t && sudo systemctl reload nginx
# The API needs nothing new: the admin calls /go/, which those blocks already proxy.

location = /admin {
  return 301 /admin/;
}

# The folder is outside the server's `root`, hence `alias` (both paths end in "/").
# React Router owns every path under /admin/: unknown files fall back to the SPA.
location /admin/ {
  alias /apps/www/numi/admin/;
  try_files $uri $uri/ /admin/index.html;
}

# index.html names the hashed bundle of the current build — never cache it,
# or browsers keep running the previous deploy.
location = /admin/index.html {
  alias /apps/www/numi/admin/index.html;
  add_header Cache-Control "no-cache";
}
